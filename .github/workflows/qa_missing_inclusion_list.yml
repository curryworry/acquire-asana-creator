name: QA Missing Inclusion List

on:
  schedule:
    # 9:00 AM America/New_York is 13:00 UTC during EDT and 14:00 UTC during EST.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  load-qa-table:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/679417827301/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@ops-control-center-503319.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Load missing inclusion QA table
        env:
          QA_SDF_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
          QA_SDF_USE_BID_MANAGER_SPEND: "true"
          QA_BID_MANAGER_REPORT_TIMEOUT_SECONDS: "900"
          QA_SDF_DOWNLOAD_TIMEOUT_SECONDS: "1800"
          QA_SDF_LINE_ITEM_BATCH_SIZE: "100"
          QA_SDF_IO_BATCH_SIZE: "25"
        run: |
          APP_SECRETS_TOML="$(gcloud secrets versions access latest --secret streamlit-secrets-toml --project ops-control-center-503319)" \
            python scripts/load_qa_missing_inclusion_list.py
