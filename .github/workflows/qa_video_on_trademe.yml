name: QA Video on TradeMe

on:
  schedule:
    # 9:00 AM America/New_York is 13:00 UTC during EDT and 14:00 UTC during EST.
    # The script checks local New York time and exits unless it is 9 AM.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  load-qa-table:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load TradeMe video QA table
        env:
          BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET || secrets.BQ_DATASET }}
          BQ_SERVICE_ACCOUNT_JSON: ${{ secrets.BQ_SERVICE_ACCOUNT_JSON }}

          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER: ${{ vars.GMAIL_USER || secrets.GMAIL_USER }}

          QA_TRADEME_VIDEO_SUBJECT_CONTAINS: ${{ vars.QA_TRADEME_VIDEO_SUBJECT_CONTAINS || secrets.QA_TRADEME_VIDEO_SUBJECT_CONTAINS }}
          QA_TRADEME_VIDEO_GMAIL_SEARCH_QUERY: ${{ vars.QA_TRADEME_VIDEO_GMAIL_SEARCH_QUERY || secrets.QA_TRADEME_VIDEO_GMAIL_SEARCH_QUERY }}
          QA_TRADEME_VIDEO_MAX_MESSAGES: ${{ vars.QA_TRADEME_VIDEO_MAX_MESSAGES || secrets.QA_TRADEME_VIDEO_MAX_MESSAGES }}
          QA_TRADEME_VIDEO_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: python scripts/load_qa_video_on_trademe.py
