name: Campaign Not Live Alert

on:
  schedule:
    # Single daily trigger at 18:00 UTC; script enforces NZ weekday 6:00 AM.
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run campaign not-live alert
        env:
          BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET || secrets.BQ_DATASET }}
          BQ_VIEW: ${{ vars.BQ_VIEW || secrets.BQ_VIEW }}
          BQ_SERVICE_ACCOUNT_JSON: ${{ secrets.BQ_SERVICE_ACCOUNT_JSON }}

          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER: ${{ vars.GMAIL_USER || secrets.GMAIL_USER }}

          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO || secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_SUBJECT: ${{ vars.ALERT_EMAIL_SUBJECT || secrets.ALERT_EMAIL_SUBJECT }}
          ALERT_FORCE_RUN: ${{ vars.ALERT_FORCE_RUN || secrets.ALERT_FORCE_RUN }}
        run: python scripts/campaign_not_live_alert.py
