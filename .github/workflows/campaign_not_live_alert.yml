name: Sync Supermetrics and Send Campaign Alert

on:
  schedule:
    # 7:30 AM NZST / 8:30 AM NZDT, after the observed Supermetrics refresh window.
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: supermetrics-sync-and-campaign-alert
  cancel-in-progress: false

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Check New Zealand run day
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now_nz = datetime.now(ZoneInfo("Pacific/Auckland"))
          should_run = os.environ["EVENT_NAME"] == "workflow_dispatch" or now_nz.weekday() < 5
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          print(f"NZ time: {now_nz.isoformat()}; run={should_run}")
          PY

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.run == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/679417827301/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@ops-control-center-503319.iam.gserviceaccount.com

      - name: Setup gcloud
        if: steps.gate.outputs.run == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync Supermetrics BigQuery data
        if: steps.gate.outputs.run == 'true'
        run: |
          gcloud run jobs execute supermetrics-bigquery-sync \
            --project ops-control-center-503319 \
            --region australia-southeast1 \
            --wait

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run campaign not-live alert
        if: steps.gate.outputs.run == 'true'
        env:
          BQ_PROJECT_ID: ${{ vars.BQ_PROJECT_ID || secrets.BQ_PROJECT_ID }}
          BQ_DATASET: ${{ vars.BQ_DATASET || secrets.BQ_DATASET }}
          BQ_VIEW: ${{ vars.BQ_VIEW || secrets.BQ_VIEW }}
          BQ_SERVICE_ACCOUNT_JSON: ${{ secrets.BQ_SERVICE_ACCOUNT_JSON }}

          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER: ${{ vars.GMAIL_USER || secrets.GMAIL_USER }}

          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO || secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_SUBJECT: ${{ vars.ALERT_EMAIL_SUBJECT || secrets.ALERT_EMAIL_SUBJECT }}
          # The workflow gate enforces NZ weekdays; the chain intentionally runs
          # after the former strict 6:00 AM script window.
          ALERT_FORCE_RUN: "true"
        run: python scripts/campaign_not_live_alert.py
